<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Job Opening — EDC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="section" id="jobWrap">
  <div class="container loading-state">Loading job details…</div>
</section>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(async function () {
  await EDC_UI.renderHeader();
  await EDC_UI.renderFooter();
  const id = new URLSearchParams(location.search).get("id");
  const wrap = document.getElementById("jobWrap");
  const res = await EDC_API.getJob(id);
  if (!res.success) {
    wrap.innerHTML = `<div class="container empty-state"><h3>Job not found</h3><a href="careers.html" class="btn btn-outline mt-4">Back to careers</a></div>`;
    return;
  }
  const j = res.data;
  document.getElementById("pageTitle").textContent = j.title + " — EDC";
  wrap.innerHTML = `
    <div class="container" style="max-width:820px;">
      <span class="stamp stamp-open">${EDC_UI.escapeHtml(j.type)} · ${EDC_UI.escapeHtml(j.status)}</span>
      <h1 class="mt-4">${EDC_UI.escapeHtml(j.title)}</h1>
      <div class="job-card"><div class="meta mt-4">
        <span>📍 ${EDC_UI.escapeHtml(j.campus)}</span>
        <span>💰 ${EDC_UI.escapeHtml(j.salary)}</span>
        <span>📅 Starts ${EDC_UI.escapeHtml(j.start_date)}</span>
        <span>📘 ${EDC_UI.escapeHtml(j.subject)}</span>
      </div></div>
      <p class="mt-6">${EDC_UI.escapeHtml(j.description)}</p>

      <h3 class="mt-6">Requirements</h3>
      <ul style="margin-top:.75rem;list-style:disc;padding-left:1.4rem;">${(j.requirements||[]).map(r=>`<li style="margin-bottom:.4rem;">${EDC_UI.escapeHtml(r)}</li>`).join("")}</ul>

      <h3 class="mt-6">Benefits</h3>
      <ul style="margin-top:.75rem;list-style:disc;padding-left:1.4rem;">${(j.benefits||[]).map(r=>`<li style="margin-bottom:.4rem;">${EDC_UI.escapeHtml(r)}</li>`).join("")}</ul>

      <a href="apply.html?job=${j.id}" class="btn btn-gold mt-6">Apply for this position</a>
    </div>
  `;
})();
</script>

<script src="assets/js/theme.js"></script>
<script src="assets/js/popups.js"></script>


</body>
</html>
