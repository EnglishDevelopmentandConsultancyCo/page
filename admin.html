<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — EDC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">EDC</span>
      <span class="brand-text"><strong>EDC Admin</strong><span id="sidebarRole">—</span></span>
    </div>
    <nav>
      <div class="admin-nav-group">
        <h5>Overview</h5>
        <a href="#" data-view="dashboard" class="active">Dashboard</a>
      </div>
      <div class="admin-nav-group">
        <h5>Recruitment</h5>
        <a href="#" data-view="applicants">Applicants</a>
        <a href="#" data-view="jobs">Job Openings</a>
      </div>
      <div class="admin-nav-group">
        <h5>Website</h5>
        <a href="#" data-view="settings">Site Settings</a>
        <a href="#" data-view="comments">Comments</a>
      </div>
      <div class="admin-nav-group" id="developerNavGroup" style="display:none;">
        <h5>Developer</h5>
        <a href="#" data-view="developer">System & Diagnostics</a>
      </div>
    </nav>
    <a href="index.html" class="btn btn-outline btn-sm btn-block mt-6" style="color:#fff;border-color:rgba(255,255,255,.3)">View Public Site</a>
    <button class="btn btn-ghost btn-sm btn-block mt-4" id="logoutBtn" style="color:rgba(255,255,255,.7)">Log Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="viewTitle">Dashboard</h1>
      <span class="stamp stamp-gold" id="userStamp"></span>
    </div>
    <div id="viewContent"></div>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
const esc = EDC_UI.escapeHtml;
let session;

async function viewDashboard() {
  const stats = (await EDC_API.getDashboardStats()).data;
  const cards = [
    ["Total Applicants", stats.total_applicants], ["New Applications", stats.new_applications],
    ["Under Review", stats.under_review], ["Shortlisted", stats.shortlisted],
    ["Interviews", stats.interviews], ["Offers", stats.offers],
    ["Hired", stats.hired], ["Rejected", stats.rejected],
  ];
  document.getElementById("viewContent").innerHTML = `
    <div class="grid grid-4">
      ${cards.map(([label, value]) => `<div class="stat-card"><div class="value">${value}</div><div class="label">${label}</div></div>`).join("")}
    </div>
    <div class="panel mt-6">
      <div class="panel-head"><h3>Recent Applicants</h3><a href="#" data-view="applicants" class="btn btn-outline btn-sm">View all</a></div>
      <div id="recentApplicants"></div>
    </div>`;
  const applicants = (await EDC_API.getApplicants()).data.slice(0, 5);
  document.getElementById("recentApplicants").innerHTML = applicantsTable(applicants, false);
  bindNav();
}

function applicantsTable(list, withActions = true) {
  if (!list.length) return `<div class="empty-state"><h3>No applicants found.</h3><p>Try changing your filters.</p></div>`;
  return `<div class="table-wrap"><table class="data-table"><thead><tr>
    <th>ID</th><th>Name</th><th>Position</th><th>Campus</th><th>Applied</th><th>Experience</th><th>Status</th>${withActions?'<th>Assigned</th><th></th>':''}
  </tr></thead><tbody>
    ${list.map(a => `<tr>
      <td><span class="stamp stamp-teal" style="padding:.15rem .5rem;">${a.id}</span></td>
      <td>${esc(a.name)}</td><td>${esc(a.position)}</td><td>${esc(a.campus)}</td><td>${esc(a.date)}</td><td>${esc(a.experience)}</td>
      <td><span class="badge ${EDC_UI.statusBadgeClass(a.status)}">${esc(a.status)}</span></td>
      ${withActions ? `<td>${esc(a.assigned)}</td><td>
        <select class="input" style="width:auto;font-size:.75rem;padding:.35rem .5rem;" data-status-select="${a.id}">
          ${["Submitted","Under Review","Shortlisted","Interview Requested","Interview Scheduled","Offer Sent","Hired","Rejected","Withdrawn"].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join("")}
        </select></td>` : ''}
    </tr>`).join("")}
  </tbody></table></div>`;
}

async function viewApplicants() {
  document.getElementById("viewContent").innerHTML = `
    <div class="panel">
      <div class="flex gap-3 mb-4" style="flex-wrap:wrap;">
        <input class="input" style="max-width:260px;" id="searchInput" placeholder="Search name or ID…">
        <select class="input" style="max-width:220px;" id="statusFilter">
          <option value="">All statuses</option>
          ${["Submitted","Under Review","Shortlisted","Interview Requested","Offer Sent","Hired","Rejected"].map(s=>`<option>${s}</option>`).join("")}
        </select>
      </div>
      <div id="applicantsTableWrap" class="loading-state">Loading applicants…</div>
    </div>`;
  async function refresh() {
    const search = document.getElementById("searchInput").value;
    const status = document.getElementById("statusFilter").value;
    const list = (await EDC_API.getApplicants({ search, status })).data;
    document.getElementById("applicantsTableWrap").innerHTML = applicantsTable(list);
    document.querySelectorAll("[data-status-select]").forEach(sel => {
      sel.addEventListener("change", async () => {
        const r = await EDC_API.updateApplicantStatus(sel.dataset.statusSelect, sel.value);
        EDC_UI.toast(r.message, "success");
      });
    });
  }
  document.getElementById("searchInput").addEventListener("input", refresh);
  document.getElementById("statusFilter").addEventListener("change", refresh);
  refresh();
}

async function viewJobs() {
  const jobs = (await EDC_API.getJobs({ status: "Published" })).data;
  document.getElementById("viewContent").innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Job Openings</h3><button class="btn btn-primary btn-sm" disabled title="Demo mode">+ New Job Posting</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Title</th><th>Type</th><th>Campus</th><th>Status</th></tr></thead><tbody>
        ${jobs.map(j => `<tr><td>${j.id}</td><td>${esc(j.title)}</td><td>${esc(j.type)}</td><td>${esc(j.campus)}</td><td><span class="badge badge-shortlisted">${esc(j.status)}</span></td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
}

async function viewSettings() {
  const s = (await EDC_API.getSiteSettings()).data;
  document.getElementById("viewContent").innerHTML = `
    <div class="panel" style="max-width:640px;">
      <h3 class="mb-4">Site Settings (CMS)</h3>
      <div class="alert alert-info">Editing these fields updates the public website immediately — no code changes required (spec §129).</div>
      <div class="field"><label>Tagline</label><input class="input" id="s_tagline" value="${esc(s.tagline)}"></div>
      <div class="field"><label>Description</label><textarea class="input" id="s_description">${esc(s.description)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input class="input" id="s_phone" value="${esc(s.phone)}"></div>
        <div class="field"><label>Email</label><input class="input" id="s_email" value="${esc(s.email)}"></div>
      </div>
      <div class="field"><label>Address</label><input class="input" id="s_address" value="${esc(s.address)}"></div>
      <div class="field"><label>Theme</label>
        <select class="input" id="s_theme">
          ${["default","mourning","summer","christmas","valentine"].map(t=>`<option value="${t}" ${s.theme===t?'selected':''}>${t}</option>`).join("")}
        </select>
        <div class="hint">Full theme scheduler / campaign manager is planned for a future release — see README roadmap.</div>
      </div>
      <button class="btn btn-primary mt-4" id="saveSettingsBtn">Save Changes</button>
    </div>`;
  document.getElementById("saveSettingsBtn").addEventListener("click", () => {
    Object.assign(window.EDC_DEMO.siteSettings, {
      tagline: document.getElementById("s_tagline").value,
      description: document.getElementById("s_description").value,
      phone: document.getElementById("s_phone").value,
      email: document.getElementById("s_email").value,
      address: document.getElementById("s_address").value,
      theme: document.getElementById("s_theme").value,
    });
    EDC_UI.toast("Settings saved. Visit the public site to see the update.", "success");
  });
}

async function viewComments() {
  const comments = (await EDC_API.getComments()).data;
  document.getElementById("viewContent").innerHTML = `
    <div class="panel">
      <h3 class="mb-4">Comments & Suggestions</h3>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>From</th><th>Page</th><th>Message</th><th>Date</th><th>Status</th></tr></thead><tbody>
        ${comments.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.page)}</td><td>${esc(c.message)}</td><td>${esc(c.date)}</td><td><span class="badge badge-shortlisted">${esc(c.status)}</span></td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
}

async function viewDeveloper() {
  document.getElementById("viewContent").innerHTML = `
    <div class="grid grid-2">
      <div class="panel">
        <h3 class="mb-4">Developer</h3>
        <p><strong>${esc(window.EDC_CONFIG.DEVELOPER_NAME)}</strong></p>
        <p class="muted">Unrestricted system access — permissions, configuration, diagnostics, backups.</p>
      </div>
      <div class="panel">
        <h3 class="mb-4">System Health</h3>
        <p>API Mode: <span class="badge ${window.EDC_CONFIG.DEMO_MODE ? 'badge-review' : 'badge-shortlisted'}">${window.EDC_CONFIG.DEMO_MODE ? 'DEMO' : 'LIVE'}</span></p>
        <p class="mt-2">API URL: <code>${esc(window.EDC_CONFIG.API_URL || '(not configured)')}</code></p>
        <p class="mt-2">Google Sheets Status: <span class="badge badge-shortlisted">${window.EDC_CONFIG.DEMO_MODE ? 'N/A (demo)' : 'Check /backend'}</span></p>
      </div>
    </div>`;
}

const VIEWS = { dashboard: viewDashboard, applicants: viewApplicants, jobs: viewJobs, settings: viewSettings, comments: viewComments, developer: viewDeveloper };

function bindNav() {
  document.querySelectorAll("[data-view]").forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      document.querySelectorAll(".admin-nav-group a").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(`[data-view="${a.dataset.view}"]`).forEach(x => x.classList.add("active"));
      document.getElementById("viewTitle").textContent = a.textContent;
      VIEWS[a.dataset.view]();
    };
  });
}

(async function () {
  session = EDC_UI.requireRole(["admin", "developer"]);
  if (!session) return;
  document.getElementById("sidebarRole").textContent = session.role === "developer" ? "Developer" : "Administrator";
  document.getElementById("userStamp").textContent = session.name;
  if (session.role === "developer") document.getElementById("developerNavGroup").style.display = "";
  document.getElementById("logoutBtn").addEventListener("click", () => { EDC_API.logout(); window.location.href = "login.html"; });
  bindNav();
  viewDashboard();
})();
</script>
</body>
</html>
